spring:
  application:
    name: realestate-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/realestate?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:realestate}
    password: ${DB_PASSWORD:realestate}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Base64-encoded 256-bit key. ALWAYS override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
    issuer: ${JWT_ISSUER:realestate-api}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
